[project]
name = "ghflow"
version = "0.0.0"
description = "GH Archive through a batch path and a replayed stream that must agree to the event"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "orjson>=3.12,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    "import-linter>=2.3",
]
# Talks to the running stack (.\make.ps1 test-integration); CI installs it for type checks only.
integration = [
    "pyarrow>=25,<26",
    "psycopg[binary]>=3.3,<4",
]

[project.scripts]
ghflow-profile = "ghflow.commands.profile:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghflow"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", ".github/scripts", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "SIM",       # simplify
    "PTH",       # pathlib only: the repo path contains a space
    "RUF",
    "C90",       # mccabe complexity      } the readability ratchet: floors below, mirrored in
    "PLR0912",   # branches per function  } tests/unit/test_laws.py; a refine may tighten them,
    "PLR0913",   # arguments per function } loosening one needs an ADR (docs/ITERATION.md)
    "PLR0915",   # statements per function}
]
ignore = ["E501"]  # the formatter owns line length

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 10
max-statements = 40

[tool.ruff.lint.isort]
known-first-party = ["ghflow", "story_lint", "layout_lint", "factories"]

# ---------------------------------------------------------------- import-linter
# Core/shell layers (docs/ITERATION.md, "How readability and cohesion are measured"). A module
# may import only from layers below it; modules sharing a layer may not import each other.
[tool.importlinter]
root_package = "ghflow"

[[tool.importlinter.contracts]]
name = "The shell sits on the core, never the reverse"
type = "layers"
layers = [
    "ghflow.commands",
    "ghflow.archive | ghflow.contract | ghflow.profiling",
    "ghflow.events | ghflow.fields | ghflow.exitcodes",
    "ghflow.hours",
    "ghflow.settings",
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src", ".github/scripts", "scripts", "tests"]
mypy_path = ".github/scripts"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Airflow runs in its own image (tests/dags execute there, not on the host).
module = ["airflow", "airflow.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# pyarrow ships without complete type hints.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/unit"]  # tests/integration needs the stack; tests/dags runs in the Airflow image
pythonpath = [".github/scripts"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: needs the compose stack up (.\\make.ps1 test-integration)",
]
