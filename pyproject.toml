[project]
name = "ghflow"
version = "0.0.0"
description = "GH Archive through a batch path and a replayed stream that must agree to the event"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyarrow>=25,<26",
    "psycopg[binary]>=3.3,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    "import-linter>=2.3",
    "vulture>=2.14",
]
# Talks to the running stack (.\make.ps1 test-integration). Its clients (pyarrow, psycopg) became
# runtime dependencies in M1-S1; the group stays as the CI/make entry point for these tests.
integration = []
# dbt on DuckDB (M1-S3). Installed into the Airflow image's project venv and by CI's dbt-parse
# job; versions re-verified on PyPI 2026-10-05 (CLAUDE.md pins).
# The replayed stream (M2): Kafka client and Avro, versions re-verified on PyPI 2026-10-10
# (planning observed confluent-kafka 2.15.1 / fastavro 1.12.2; both have moved on).
stream = [
    "confluent-kafka>=2.16.0,<2.17",
    "fastavro>=1.13.1,<1.14",
]
# ClickHouse (M4-S1): the HTTP client for apply, verify and the third reconcile witness;
# re-verified on PyPI 2026-10-10 (planning observed 1.9.0; 1.10.0 shipped 2026-10-07).
clickhouse = [
    "clickhouse-connect>=1.10.0,<1.11",
]
# The stakeholder dashboard (M5-S2): Plotly figures, rendered by Quarto; re-verified on PyPI
# 2026-10-11 (7.1.0, 2026-09-15).
dashboard = [
    "plotly>=7.1.0,<7.2",
]
dbt = [
    "dbt-core>=1.12.5,<1.13",
    "dbt-duckdb>=1.11.0,<1.12",
    "duckdb>=1.5.6,<1.6",
]

[project.scripts]
ghflow-profile = "ghflow.commands.profile:main"
ghflow-ingest = "ghflow.commands.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghflow"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", ".github/scripts", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "SIM",       # simplify
    "PTH",       # pathlib only: the repo path contains a space
    "RUF",
    "C90",       # mccabe complexity      } the readability ratchet: floors below, mirrored in
    "PLR0912",   # branches per function  } tests/unit/test_laws.py; a refine may tighten them,
    "PLR0913",   # arguments per function } loosening one needs an ADR (docs/ITERATION.md)
    "PLR0915",   # statements per function}
]
ignore = ["E501"]  # the formatter owns line length

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 10
max-statements = 40

[tool.ruff.lint.isort]
known-first-party = ["ghflow", "story_lint", "layout_lint", "factories"]

# ---------------------------------------------------------------- import-linter
# Core/shell layers (docs/ITERATION.md, "How readability and cohesion are measured"). A module
# may import only from layers below it; modules sharing a layer may not import each other.
[tool.importlinter]
root_package = "ghflow"

[[tool.importlinter.contracts]]
name = "The shell sits on the core, never the reverse"
type = "layers"
layers = [
    "ghflow.commands",
    "ghflow.stream",
    "ghflow.archive | ghflow.audit | ghflow.storage | ghflow.retention | ghflow.contract | ghflow.profiling | ghflow.quality | ghflow.reconcile | ghflow.clickhouse | ghflow.dashboard | ghflow.figures",
    "ghflow.bronze",
    "ghflow.events | ghflow.fields | ghflow.exitcodes",
    "ghflow.hours",
    "ghflow.settings",
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src", ".github/scripts", "scripts", "tests"]
mypy_path = ".github/scripts"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Airflow runs in its own image (tests/dags execute there, not on the host).
module = ["airflow", "airflow.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# pyarrow ships without complete type hints.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# M5: plotly (dashboard) and vulture (the cohesion test) ship no type information.
module = ["plotly", "plotly.*", "vulture", "vulture.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/unit"]  # tests/integration needs the stack; tests/dags runs in the Airflow image
pythonpath = [".github/scripts"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: needs the compose stack up (.\\make.ps1 test-integration)",
]
