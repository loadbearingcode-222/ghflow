# Topic specs as code (M2-S1, ADR-0005), applied idempotently by apply-topics.sh on every `up`.
# One topic per line: name, partitions, then topic configs. Partitions can grow, never shrink
# (the script refuses). Partitions and retention mirror ghflow.settings (a unit test checks).
#
# LogAppendTime: retention counts from when a record was replayed, not from its event time,
# which is weeks old by the time it is replayed and would expire at once.
gharchive.events 6 retention.ms=604800000 cleanup.policy=delete message.timestamp.type=LogAppendTime compression.type=producer
# The repo-state changelog (M3-S2, ADR-0009): compacted, so the latest record per repo id is kept
# forever; it is the processor's store, rebuilt from here on every start.
gharchive.repo_state 6 cleanup.policy=compact compression.type=producer
