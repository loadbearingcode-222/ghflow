# Serves the published stakeholder dashboard (M5-S2): `current` is a symlink the render task
# switches atomically to the newest checked release.
server {
    listen 80;
    root /srv/site/current;
    index index.html;
    location = /healthz {
        return 200 "ok";
    }
    location / {
        try_files $uri $uri/ =404;
    }
    add_header Cache-Control "no-cache";
}
