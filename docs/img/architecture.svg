<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>ghflow architecture blueprint</title>
<desc>GH Archive feeds a batch path (ingest DAG, bronze in MinIO, dbt on DuckDB) and a replayed stream path (Redpanda + Schema Registry, lander and repo state, ClickHouse). Both feed trust checks, which feed a Quarto dashboard for stakeholders and Grafana for engineers.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="700" fill="#FFFFFF"/>
<text x="340" y="26" text-anchor="middle" font-size="16" font-weight="500" fill="#2C2C2A">ghflow — two paths that must agree to the event</text>
<g font-size="14">
<rect x="230" y="50" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="340" y="74" text-anchor="middle" font-weight="500" fill="#2C2C2A">GH Archive</text>
<text x="340" y="94" text-anchor="middle" font-size="12" fill="#5F5E5A">Hourly files, 0.5 GB/day</text>
</g>
<g fill="none" stroke="#73726C" stroke-width="1.25">
<path d="M340 106 L340 126 L185 126 L185 148" marker-end="url(#arrow)"/>
<path d="M340 126 L495 126 L495 148" marker-end="url(#arrow)"/>
</g>
<rect x="40" y="150" width="290" height="296" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="185" y="176" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Batch path</text>
<text x="185" y="194" text-anchor="middle" font-size="12" fill="#0F6E56">M1 · partition watermark</text>
<rect x="350" y="150" width="290" height="296" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="495" y="176" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Stream path</text>
<text x="495" y="194" text-anchor="middle" font-size="12" fill="#534AB7">M2–M4 · consumer offsets</text>
<g font-size="14">
<rect x="60" y="210" width="250" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.75"/>
<text x="185" y="234" text-anchor="middle" font-weight="500" fill="#2C2C2A">Ingest DAG (Airflow 3)</text>
<text x="185" y="254" text-anchor="middle" font-size="12" fill="#5F5E5A">Sensor, contract, audit</text>
<rect x="60" y="290" width="250" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.75"/>
<text x="185" y="314" text-anchor="middle" font-weight="500" fill="#2C2C2A">Bronze in MinIO</text>
<text x="185" y="334" text-anchor="middle" font-size="12" fill="#5F5E5A">Projected Parquet, hourly</text>
<rect x="60" y="370" width="250" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.75"/>
<text x="185" y="394" text-anchor="middle" font-weight="500" fill="#2C2C2A">dbt on DuckDB</text>
<text x="185" y="414" text-anchor="middle" font-size="12" fill="#5F5E5A">Silver, SCD2, KPI marts</text>
<rect x="370" y="210" width="250" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.75"/>
<text x="495" y="234" text-anchor="middle" font-weight="500" fill="#2C2C2A">Redpanda + Schema Registry</text>
<text x="495" y="254" text-anchor="middle" font-size="12" fill="#5F5E5A">Replayed hours, Avro</text>
<rect x="370" y="290" width="250" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.75"/>
<text x="495" y="314" text-anchor="middle" font-weight="500" fill="#2C2C2A">Lander and repo state</text>
<text x="495" y="334" text-anchor="middle" font-size="12" fill="#5F5E5A">Offsets, compacted topic</text>
<rect x="370" y="370" width="250" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.75"/>
<text x="495" y="394" text-anchor="middle" font-weight="500" fill="#2C2C2A">ClickHouse</text>
<text x="495" y="414" text-anchor="middle" font-size="12" fill="#5F5E5A">Kafka engine, upserts</text>
</g>
<g fill="none" stroke="#73726C" stroke-width="1.25">
<path d="M185 266 L185 288" marker-end="url(#arrow)"/>
<path d="M185 346 L185 368" marker-end="url(#arrow)"/>
<path d="M495 266 L495 288" marker-end="url(#arrow)"/>
<path d="M495 346 L495 368" marker-end="url(#arrow)"/>
<path d="M310 318 L340 318 L340 238 L368 238" marker-end="url(#arrow)"/>
<path d="M185 446 L185 474" marker-end="url(#arrow)"/>
<path d="M495 446 L495 474" marker-end="url(#arrow)"/>
<path d="M185 532 L185 564" marker-end="url(#arrow)"/>
<path d="M495 532 L495 564" marker-end="url(#arrow)"/>
</g>
<g font-size="14">
<rect x="40" y="476" width="600" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text x="340" y="500" text-anchor="middle" font-weight="500" fill="#633806">Trust checks</text>
<text x="340" y="520" text-anchor="middle" font-size="12" fill="#854F0B">Event-mix flags, three-way reconciliation (batch = stream = ClickHouse)</text>
<rect x="60" y="566" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="185" y="590" text-anchor="middle" font-weight="500" fill="#2C2C2A">Quarto dashboard</text>
<text x="185" y="610" text-anchor="middle" font-size="12" fill="#5F5E5A">Stakeholders · M5</text>
<rect x="370" y="566" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="495" y="590" text-anchor="middle" font-weight="500" fill="#2C2C2A">Grafana</text>
<text x="495" y="610" text-anchor="middle" font-size="12" fill="#5F5E5A">Engineers · M4</text>
</g>
<text x="340" y="662" text-anchor="middle" font-size="12" fill="#5F5E5A">Teal: batch path · Purple: stream path · Amber: trust · Operational state: Postgres ghflow_ops</text>
<text x="340" y="682" text-anchor="middle" font-size="12" fill="#5F5E5A">The replayer publishes bronze, so any batch-vs-stream difference comes from the stream alone</text>
</svg>
