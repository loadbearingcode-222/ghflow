# Every pull request and every push to main.
#
# story-lint and layout-lint enforce the two things this repo is judged by first: the layout
# declared in docs/MILESTONES.md, and PRs that arrive as the plan's stories, in order.
#
# `edited` re-runs story-lint when a PR title changes. Every other job skips edits: a PR body
# update is not a code change.
#
# The full stack does not fit a private-repo runner, so CI proves what it can in isolation; each
# story's end-to-end acceptance runs locally and its evidence is committed under automation/runs/.
# Jobs arrive with the stories that need them: compose-render and dag-integrity (M0-S4),
# import-layers and ratchet (M0-S5), dbt-parse (M1-S3), avro-compat (M2-S1). Every action is pinned
# by commit SHA, its release named beside it.
name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# A PR edit (title/body) runs only story-lint, so it gets its own group: in one shared group,
# editing a PR body cancelled the in-flight code run and left only skipped jobs (M1-S1).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'edited' && 'edit' || 'code' }}
  cancel-in-progress: true

jobs:
  story-lint:
    name: story-lint
    # Only open PRs: editing a merged PR fires `edited` too, and would report ALREADY-MERGED.
    if: github.event_name == 'pull_request' && github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (node24), verified 2026-10-05
        with:
          fetch-depth: 0
      - name: The PR is the next story in docs/MILESTONES.md
        # Branch and title reach the script through env, never interpolated into the shell.
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 .github/scripts/story_lint.py --branch "$HEAD_REF" --title "$PR_TITLE" --main-ref origin/main

  layout-lint:
    name: layout-lint
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (node24), verified 2026-10-05
      - name: Every tracked path is declared in docs/MILESTONES.md
        run: python3 .github/scripts/layout_lint.py

  quality:
    name: lint / types / unit tests
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (node24), verified 2026-10-05
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0 (node24), verified 2026-10-05
      - run: uv sync --locked --group dev --group integration
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest tests/unit

  compose-render:
    name: compose render
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (node24), verified 2026-10-05
      - name: compose.yaml renders with every required variable set
        # Dummy values: this proves the file parses and every ${VAR:?} is declared in
        # .env.example, not that the stack runs (that is each story's local acceptance).
        run: |
          sed 's/=$/=ci-dummy/' .env.example > .env
          docker compose config --quiet
          echo "services: $(docker compose config --services | xargs)"
      - name: Every third-party image is pinned by tag AND digest (ADR-0001)
        # Images this repo builds (ghflow/*) are exempt: their own Dockerfile pins its bases.
        run: |
          sed 's/=$/=ci-dummy/' .env.example > .env
          unpinned=$(docker compose config --images | grep -v '^ghflow/' | grep -v '@sha256:' || true)
          if [ -n "$unpinned" ]; then
            echo "::error title=compose-render::IMAGE-UNPINNED: $unpinned"
            exit 1
          fi
          # An image reference has a ':' or '/' (a stage name like `base` has neither) and must
          # carry its digest; `FROM base AS runtime` reuses a stage that already did.
          if grep -nE '^FROM [^ @]*[:/][^ @]*( |$)|COPY --from=[^ @]*[:/][^ @]* ' docker/*/Dockerfile; then
            echo "::error title=compose-render::IMAGE-UNPINNED: a Dockerfile base or COPY --from lacks a digest"
            exit 1
          fi

  dag-integrity:
    name: dag integrity
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (node24), verified 2026-10-05
      - name: Build the Airflow image's test stage
        run: docker build -f docker/airflow/Dockerfile --target dag-test -t ghflow/airflow:dag-test .
      - name: Parse every DAG inside the image, with networking off
        # pytest is baked into the dag-test stage, so the check needs no network (issue #14).
        run: >-
          mkdir -p airflow/dags &&
          docker run --rm --network none
          -e AIRFLOW__CORE__LOAD_EXAMPLES=false
          -v "$PWD/airflow/dags:/opt/airflow/dags:ro"
          ghflow/airflow:dag-test
          python -m pytest -q -p no:cacheprovider /opt/ghflow/tests/dags

  import-layers:
    name: import layers
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (node24), verified 2026-10-05
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0 (node24), verified 2026-10-05
      - run: uv sync --locked --group dev
      - name: The shell sits on the core, never the reverse (pyproject.toml [tool.importlinter])
        run: uv run lint-imports

  ratchet:
    name: ratchet
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (node24), verified 2026-10-05
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0 (node24), verified 2026-10-05
      - run: uv sync --locked --group dev
      - name: Complexity, branch, argument and statement floors (ruff)
        run: uv run ruff check --select C90,PLR0912,PLR0913,PLR0915 --output-format=github .
      - name: One-home laws, layers by AST, floors no looser, module size budget
        run: uv run pytest -q tests/unit/test_laws.py tests/unit/test_events.py

  dbt-parse:
    name: dbt parse
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (node24), verified 2026-10-05
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0 (node24), verified 2026-10-05
      - run: uv sync --locked --group dbt
      - name: The generated silver models match ghflow.fields
        run: uv run python -m ghflow.commands.silver check
      - name: The dbt project parses (no warehouse needed)
        working-directory: dbt/ghflow
        run: uv run dbt parse --profiles-dir .
