version: 2

models:
  - name: dim_repo
    description: "Repository names over time (SCD2): one row per version; the current one has no valid_to."
    config:
      contract:
        enforced: true
    data_tests:
      - scd2_invariants:
          arguments:
            id_column: repo_id
    columns:
      - name: repo_id
        data_type: bigint
        data_tests: [not_null]
      - name: repo_name
        data_type: varchar
        data_tests: [not_null]
      - name: valid_from
        data_type: timestamp with time zone
        data_tests: [not_null]
      - name: valid_to
        data_type: timestamp with time zone
      - name: is_current
        data_type: boolean
        data_tests: [not_null]

  - name: dim_actor
    description: "Actor logins over time (SCD2): one row per version; the current one has no valid_to."
    config:
      contract:
        enforced: true
    data_tests:
      - scd2_invariants:
          arguments:
            id_column: actor_id
    columns:
      - name: actor_id
        data_type: bigint
        data_tests: [not_null]
      - name: actor_login
        data_type: varchar
        data_tests: [not_null]
      - name: valid_from
        data_type: timestamp with time zone
        data_tests: [not_null]
      - name: valid_to
        data_type: timestamp with time zone
      - name: is_current
        data_type: boolean
        data_tests: [not_null]
